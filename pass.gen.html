<!DOCTYPE html>
<html lang="en" data-theme="solar-gold">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy & Strong Password Generator</title>
    <meta name="description" content="Easy and strong password generator" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%23ffc312' stroke-width='3' stroke-linecap='round'%3E%3Ccircle cx='13' cy='13' r='7.5'/%3E%3Cpath d='M18.5 18.5 L27 27'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text-xs: 0.8rem;
        --text-sm: 0.92rem;
        --text-base: 1rem;
        --text-lg: 1.45rem;
        --s1: 0.25rem;
        --s2: 0.5rem;
        --s3: 0.75rem;
        --s4: 1rem;
        --s5: 1.25rem;
        --s6: 1.5rem;
        --s8: 2rem;
        --s10: 2.5rem;
        --radius: 24px;
        --radius-sm: 14px;
        --sans: "Space Grotesk", "Noto Sans Devanagari", sans-serif;
        --mono: "JetBrains Mono", monospace;

        /* 🌟 SOLAR GOLD FIXED THEME 🌟 */
        --bg-overlay: rgba(10, 7, 1, 0.88);
        --panel: rgba(38, 26, 6, 0.78);
        --field: rgba(20, 14, 2, 0.9);
        --border: rgba(255, 195, 18, 0.35);
        --ink: #fffdf5;
        --muted: #d6be8c;
        --accent: #ffc312;
        --accent-glow: rgba(255, 195, 18, 0.5);
        --on-accent: #170f01;
        --hologram-grad: linear-gradient(135deg, #f79f1f 0%, #ffc312 50%, #ea2027 100%);
      }

      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--sans);
        font-size: var(--text-base);
        line-height: 1.6;
        color: var(--ink);
        background-color: #030008;
        background-image: 
          radial-gradient(circle at center, transparent 0%, var(--bg-overlay) 90%),
          linear-gradient(to bottom, var(--bg-overlay), var(--bg-overlay)),
          url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=2070&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
      }

      #confetti {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .topbar, .wrap {
        position: relative;
        z-index: 1;
      }

      /* Header */
      .topbar {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        align-items: flex-start;
        padding: var(--s5) clamp(var(--s4), 4vw, var(--s10));
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: var(--s3);
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: 0.5px;
      }
      .brand .sai {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      /* Top Inline Home Button */
      .header-home-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--ink);
        padding: 6px 14px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: var(--text-xs);
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        transition: all 0.2s ease;
      }
      .header-home-btn:hover {
        background: var(--hologram-grad);
        color: var(--on-accent);
        border-color: transparent;
        transform: translateY(-2px);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      /* Single-line Slow Blinking Main Title */
      .blinking-title {
        font-size: clamp(1.1rem, 0.9rem + 1.2vw, 1.85rem);
        font-weight: 800;
        line-height: 1.2;
        margin: 0 0 var(--s2);
        white-space: nowrap;
        background: var(--hologram-grad);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: slowBlink 3s ease-in-out infinite;
      }

      @keyframes slowBlink {
        0%, 100% {
          opacity: 1;
          filter: drop-shadow(0 0 16px var(--accent-glow));
        }
        50% {
          opacity: 0.35;
          filter: drop-shadow(0 0 2px transparent);
        }
      }

      /* Fixed Bottom-Right Developer Badge */
      .fixed-dev-badge {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: var(--muted);
        padding: 8px 18px;
        border-radius: 999px;
        font-size: var(--text-xs);
        font-weight: 600;
        z-index: 99999;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        pointer-events: auto;
      }
      .fixed-dev-badge strong {
        color: var(--accent);
        font-weight: 800;
        text-shadow: 0 0 8px var(--accent-glow);
      }

      /* Main Content */
      .wrap {
        flex: 1;
        width: 100%;
        max-width: 660px;
        margin: 0 auto;
        padding: clamp(var(--s4), 3vw, var(--s6)) clamp(var(--s4), 4vw, var(--s6)) 90px;
      }
      .sub {
        margin: 0 0 var(--s8);
        color: var(--muted);
        font-size: var(--text-sm);
      }
      .card {
        background: var(--panel);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: clamp(var(--s6), 4vw, var(--s8));
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.02);
      }
      .out {
        display: flex;
        align-items: center;
        gap: var(--s3);
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: var(--s4) var(--s5);
        min-height: 74px;
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
      }
      #pw {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-weight: 800;
        font-size: var(--text-lg);
        color: var(--accent);
        text-shadow: 0 0 12px var(--accent-glow);
        word-break: break-all;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .icon-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
        transform: scale(1.05);
      }
      .parts {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
        margin: var(--s4) 0 var(--s6);
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .parts span {
        padding: var(--s1) var(--s3);
        border-radius: 8px;
        background: var(--field);
        border: 1px solid var(--border);
        font-family: var(--mono);
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
      }
      legend {
        font-size: var(--text-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 0 var(--s3);
        font-weight: 700;
      }
      .cats {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .cat {
        padding: 10px 18px;
        font-size: var(--text-sm);
        font-weight: 600;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s;
      }
      .cat:hover {
        border-color: var(--accent);
        color: var(--ink);
      }
      .cat.is-active {
        color: var(--on-accent);
        background: var(--accent);
        border-color: transparent;
        font-weight: 700;
        box-shadow: 0 0 15px var(--accent-glow);
      }
      .cta {
        width: 100%;
        margin-top: var(--s6);
        padding: 16px;
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--hologram-grad);
        color: var(--on-accent);
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 10px 30px var(--accent-glow);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 40px var(--accent-glow);
        filter: brightness(1.1);
      }
      .hint {
        min-height: 1.3em;
        margin: var(--s3) 0 0;
        text-align: center;
        font-size: var(--text-xs);
        color: var(--accent);
        font-weight: 700;
      }
      .recent {
        margin-top: var(--s8);
      }
      .recent h2 {
        font-size: var(--text-xs);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 var(--s3);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--s2);
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
        padding: var(--s3) var(--s4);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--panel);
        font-family: var(--mono);
        font-size: var(--text-xs);
        word-break: break-all;
      }
      li.empty {
        justify-content: flex-start;
        border-style: dashed;
        background: transparent;
        color: var(--muted);
        font-family: var(--sans);
      }
      li button {
        border: 0;
        background: transparent;
        color: var(--accent);
        font-family: var(--sans);
        font-weight: 700;
        font-size: var(--text-xs);
        flex: 0 0 auto;
        cursor: pointer;
      }
      li button:hover {
        text-shadow: 0 0 8px var(--accent-glow);
      }
    </style>
  </head>
  <body>

    <header class="topbar">
      <span class="brand">
        <img class="sai" src="sai.png" width="44" height="44" alt="Sai Baba" />
        Om Sai Ram
      </span>
      
      <!-- Home Button directly below Om Sai Ram -->
      <a href="index.html" class="header-home-btn">🏠 Home</a>
    </header>

    <main class="wrap">
      <!-- Single-line Slowly Blinking Title -->
      <h1 class="blinking-title">Easy &amp; Strong Password Generator</h1>
      <p class="sub">Next-generation cyber secure keys</p>

      <section class="card">
        <div class="out">
          <output id="pw" aria-live="polite">—</output>
          <button class="icon-btn" id="copy" title="Copy" aria-label="Copy">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="11" height="11" rx="2.5" />
              <path d="M15 5.5H6.5A2.5 2.5 0 0 0 4 8v8" />
            </svg>
          </button>
        </div>

        <div class="parts" id="parts" aria-live="polite"></div>

        <fieldset>
          <legend>06 Digit Name + 01 Special Character + 06 Digit Numbers</legend>
          <div class="cats" id="cats"></div>
        </fieldset>

        <button class="cta" id="gen">⚡ Generate Password</button>
        <p class="hint" id="hint"></p>
      </section>

      <section class="recent">
        <h2>Recent Passwords</h2>
        <ul id="list">
          <li class="empty">Your last 5 passwords will appear here.</li>
        </ul>
      </section>
    </main>

    <!-- Floating Name Badge at Bottom-Right -->
    <div class="fixed-dev-badge">
      Developed by <strong>Deepak Sharma</strong>
    </div>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <script>
      const $ = (s) => document.querySelector(s);

      const WORDS = {
        animal: ["Monkey", "Rabbit", "Parrot", "Falcon", "Jaguar", "Turtle", "Donkey", "Iguana", "Impala", "Bobcat", "Walrus", "Ferret", "Kitten", "Beagle"],
        hero: ["Batman", "Shazam", "Cyborg", "Vision", "Gambit", "Bishop", "Krrish", "Arjuna", "Shakti", "Rustom", "Bharat", "Ashoka"],
        city: ["Bhopal", "Mumbai", "Indore", "Jaipur", "Kanpur", "Nagpur", "Ranchi", "Raipur", "Rajkot", "Moscow", "Sydney", "Boston", "Vienna", "Zurich", "Dublin", "Madrid"],
        name: ["Deepak", "Sharma", "Aditya", "Ananya", "Kavita", "Ramesh", "Suresh", "Rakesh", "Manish", "Nikhil", "Sanjay", "Vikram", "Ishita", "Sarita", "Rohini", "Kunwar"],
      };
      const CAT_LABELS = { all: "Any", animal: "Animal", hero: "Hero", city: "City", name: "Name" };
      const SPECIALS = "@#$&*!%+?";

      let cat = "all";
      let history = [];

      const rnd = (max) => {
        const buf = new Uint32Array(1);
        const limit = Math.floor(0xffffffff / max) * max;
        let v;
        do {
          crypto.getRandomValues(buf);
          v = buf[0];
        } while (v >= limit);
        return v % max;
      };
      const pick = (arr) => arr[rnd(arr.length)];

      function make() {
        const pool = cat === "all" ? Object.values(WORDS).flat() : WORDS[cat];
        const word = pick(pool);
        const sp = SPECIALS[rnd(SPECIALS.length)];
        let digits = "";
        for (let i = 0; i < 6; i++) digits += rnd(10);
        const pw = word + sp + digits;
        $("#pw").textContent = pw;
        $("#parts").innerHTML =
          `<span>${word}</span><span>${sp}</span><span>${digits}</span><span>${pw.length} chars</span>`;
        $("#hint").textContent = "";
        history = [pw, ...history.filter((p) => p !== pw)].slice(0, 5);
        $("#list").innerHTML = history
          .map((p) => `<li><span>${p}</span><button data-p="${encodeURIComponent(p)}">Copy</button></li>`)
          .join("");
      }

      async function copy(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const t = document.createElement("textarea");
          t.value = text;
          document.body.appendChild(t);
          t.select();
          document.execCommand("copy");
          t.remove();
        }
        $("#hint").textContent = "✓ Copied to clipboard!";
      }

      $("#cats").innerHTML = Object.keys(CAT_LABELS)
        .map(
          (k, i) =>
            `<button class="cat${i === 0 ? " is-active" : ""}" data-cat="${k}" aria-pressed="${i === 0}">${CAT_LABELS[k]}</button>`
        )
        .join("");
      $("#cats").addEventListener("click", (e) => {
        const b = e.target.closest("[data-cat]");
        if (!b) return;
        cat = b.dataset.cat;
        $("#cats")
          .querySelectorAll(".cat")
          .forEach((c) => {
            const on = c === b;
            c.classList.toggle("is-active", on);
            c.setAttribute("aria-pressed", String(on));
          });
        make();
      });

      $("#gen").addEventListener("click", make);
      $("#copy").addEventListener("click", () => copy($("#pw").textContent));
      $("#list").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-p]");
        if (b) copy(decodeURIComponent(b.dataset.p));
      });
      make();

      /* 🌟 CYBER CODE OBJECTS RAIN ANIMATION 🌟 */
      const cv = $("#confetti");
      const cx = cv.getContext("2d");
      let glyphs = [];

      const GLYPH_CHARS = [
        "0", "1", "{", "}", "</>", "λ", "⚡", "⌘", "π", "∑", "0x1", "::", "&&", "/*", "*/", "≠", "⌥", "$", "=>"
      ];

      function sizeCanvas() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }

      function newGlyph(isInitial = false) {
        return {
          char: GLYPH_CHARS[Math.floor(Math.random() * GLYPH_CHARS.length)],
          x: Math.random() * cv.width,
          y: isInitial ? Math.random() * cv.height : -30,
          size: Math.floor(Math.random() * 8 + 12),
          vy: Math.random() * 1.5 + 0.8,
          alpha: Math.random() * 0.7 + 0.2,
          rotation: (Math.random() - 0.5) * 0.3,
        };
      }

      function seed() {
        glyphs = Array.from({ length: 35 }, () => newGlyph(true));
      }

      function frame() {
        cx.clearRect(0, 0, cv.width, cv.height);
        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

        for (const g of glyphs) {
          g.y += g.vy;
          if (g.y > cv.height + 30) {
            Object.assign(g, newGlyph(false));
          }

          cx.save();
          cx.translate(g.x, g.y);
          cx.rotate(g.rotation);
          cx.globalAlpha = g.alpha;
          cx.font = `800 ${g.size}px "JetBrains Mono", monospace`;
          cx.fillStyle = accentColor;
          cx.shadowColor = accentColor;
          cx.shadowBlur = 10;
          cx.fillText(g.char, 0, 0);
          cx.restore();
        }
        requestAnimationFrame(frame);
      }

      addEventListener("resize", () => {
        sizeCanvas();
        seed();
      });

      sizeCanvas();
      seed();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
