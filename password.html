<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Password Maker</title>

<style>
body{
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background: linear-gradient(135deg,#1d2671,#c33764,#00c9ff);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:400px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:30px;
    text-align:center;
    color:white;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

h1{
    margin-bottom:20px;
}

input{
    width:92%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
    font-size:17px;
    outline:none;
    text-align:center;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    margin:5px;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.generate{
    background:#00ffae;
}

.encrypt{
    background:#ffd000;
}

.decrypt{
    background:#00c3ff;
}

.copy{
    background:#ff5e7d;
    color:white;
}

.info{
    margin-top:12px;
    font-size:14px;
    opacity:0.9;
}
</style>

<style>
.vista-back-btn{position:fixed;top:16px;left:16px;z-index:99999;padding:10px 16px;border-radius:12px;text-decoration:none;font:700 14px Segoe UI,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 6px 18px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.75)}
.vista-back-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
</style>
</head>

<body>
<a class="vista-back-btn" href="index.html">← Back to Home</a>

<div class="container">

    <h1>Password Maker</h1>

    <input type="text" id="password" placeholder="Password yahan likho ya generate karo">

    <br>

    <button class="generate" onclick="generatePassword()">Generate</button>
    <button class="encrypt" onclick="encryptPassword()">Encrypt</button>
    <button class="decrypt" onclick="decryptPassword()">Decrypt</button>
    <button class="copy" onclick="copyPassword()">Copy</button>

    <div class="info">
        Example: Gwalior@79875
    </div>

</div>

<script>

function generatePassword(){

    const words = [
        "Gwalior",
        "India",
        "Tiger",
        "Sharma",
        "Coding",
        "Bhopal",
        "Royal",
        "Future"
    ];

    const special = "@#$%&!";
    const randomWord = words[Math.floor(Math.random()*words.length)];

    let numbers = "";

    for(let i=0;i<5;i++){
        numbers += Math.floor(Math.random()*10);
    }

    const specialChar = special[Math.floor(Math.random()*special.length)];

    const finalPassword = randomWord + specialChar + numbers;

    document.getElementById("password").value = finalPassword;
}

function encryptPassword(){

    let text = document.getElementById("password").value;

    if(text===""){
        alert("Please password likhiye!");
        return;
    }

    let encrypted = btoa(text);

    document.getElementById("password").value = encrypted;
}

function decryptPassword(){

    let text = document.getElementById("password").value;

    if(text===""){
        alert("Please encrypted password likhiye!");
        return;
    }

    try{
        let decrypted = atob(text);
        document.getElementById("password").value = decrypted;
    }
    catch{
        alert("Invalid encrypted password!");
    }
}

function copyPassword(){

    let text = document.getElementById("password");

    text.select();
    text.setSelectionRange(0,99999);

    navigator.clipboard.writeText(text.value);

    alert("Password copied!");
}

</script>

</body>
</html>
