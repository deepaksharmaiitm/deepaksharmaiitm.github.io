<!DOCTYPE html>
<html lang="en" data-theme="teal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Generator</title>
    <meta name="description" content="Easy and strong password generator" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%2354d6c0' stroke-width='3' stroke-linecap='round'%3E%3Ccircle cx='13' cy='13' r='7.5'/%3E%3Cpath d='M18.5 18.5 L27 27'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text-xs: 0.8rem;
        --text-sm: 0.9rem;
        --text-base: 1rem;
        --text-lg: 1.35rem;
        --text-2xl: clamp(1.7rem, 1.1rem + 2vw, 2.6rem);
        --s1: 0.25rem;
        --s2: 0.5rem;
        --s3: 0.75rem;
        --s4: 1rem;
        --s5: 1.25rem;
        --s6: 1.5rem;
        --s8: 2rem;
        --s10: 2.5rem;
        --radius: 16px;
        --radius-sm: 11px;
        --sans: "Noto Sans Devanagari", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }

      /* ---------- 10 simple dark themes ---------- */
      [data-theme="midnight"] {
        --bg: #10141f;
        --bg2: #171d2c;
        --panel: #1a2132;
        --field: #212a3e;
        --border: #2c364d;
        --ink: #eaf0fb;
        --muted: #97a3bd;
        --accent: #4f8cff;
        --on-accent: #06122b;
      }
      [data-theme="forest"] {
        --bg: #0d1713;
        --bg2: #12211b;
        --panel: #152420;
        --field: #1c2f28;
        --border: #26413a;
        --ink: #e8f5ee;
        --muted: #93b3a5;
        --accent: #4fd18b;
        --on-accent: #062015;
      }
      [data-theme="violet"] {
        --bg: #14101f;
        --bg2: #1b1530;
        --panel: #1f1834;
        --field: #291f45;
        --border: #382a5c;
        --ink: #f0eaff;
        --muted: #a99bc9;
        --accent: #a97bff;
        --on-accent: #150826;
      }
      [data-theme="ember"] {
        --bg: #17100d;
        --bg2: #211510;
        --panel: #251813;
        --field: #33201a;
        --border: #472c23;
        --ink: #fdeee7;
        --muted: #c4a094;
        --accent: #ff7a45;
        --on-accent: #210c03;
      }
      [data-theme="ocean"] {
        --bg: #08161d;
        --bg2: #0d2029;
        --panel: #0f2530;
        --field: #163140;
        --border: #1f4557;
        --ink: #e5f4fa;
        --muted: #8fb2c0;
        --accent: #35c6e8;
        --on-accent: #03181f;
      }
      [data-theme="rose"] {
        --bg: #1a0f14;
        --bg2: #24141b;
        --panel: #29161f;
        --field: #371d29;
        --border: #4b2938;
        --ink: #ffeaf1;
        --muted: #c79aab;
        --accent: #ff5f95;
        --on-accent: #240711;
      }
      [data-theme="amber"] {
        --bg: #16130a;
        --bg2: #1f1b0e;
        --panel: #231e11;
        --field: #302818;
        --border: #443922;
        --ink: #fdf4e0;
        --muted: #bfae8b;
        --accent: #f5c144;
        --on-accent: #1e1503;
      }
      [data-theme="teal"] {
        --bg: #0a1817;
        --bg2: #0f2221;
        --panel: #112726;
        --field: #17332f;
        --border: #204841;
        --ink: #e4f7f3;
        --muted: #8fb8b0;
        --accent: #2fd6bc;
        --on-accent: #04201b;
      }
      [data-theme="slate"] {
        --bg: #14171a;
        --bg2: #1b1f23;
        --panel: #1e2327;
        --field: #272d33;
        --border: #363e46;
        --ink: #edf1f4;
        --muted: #9aa5b0;
        --accent: #9fb4c7;
        --on-accent: #10161c;
      }
      [data-theme="grape"] {
        --bg: #17101c;
        --bg2: #201528;
        --panel: #24182d;
        --field: #30203b;
        --border: #442c52;
        --ink: #f7eaff;
        --muted: #b79ac4;
        --accent: #d267e8;
        --on-accent: #200527;
      }

      /* ---------- base ---------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--sans);
        font-size: var(--text-base);
        line-height: 1.6;
        color: var(--ink);
        background: linear-gradient(170deg, var(--bg2), var(--bg));
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 8px;
      }
      #confetti {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .topbar,
      .wrap,
      .foot {
        position: relative;
        z-index: 1;
      }

      /* ---------- header ---------- */
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s4);
        align-items: center;
        justify-content: space-between;
        padding: var(--s5) clamp(var(--s4), 4vw, var(--s10));
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        font-weight: 700;
      }
      .brand .sai {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--accent);
      }
      .theme-box {
        position: relative;
      }
      .theme-btn {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s2) var(--s4);
        font-size: var(--text-sm);
        font-weight: 500;
        border-radius: 999px;
        border: 0;
        background: var(--accent);
        color: var(--on-accent);
      }
      .theme-btn .caret {
        transition: transform 0.2s ease;
      }
      .theme-btn[aria-expanded="true"] .caret {
        transform: rotate(180deg);
      }
      .themes {
        position: absolute;
        right: 0;
        top: calc(100% + var(--s3));
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s2);
        padding: var(--s3);
        width: max-content;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
      }
      .themes[hidden] {
        display: none;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--s2);
        padding: var(--s2) var(--s3);
        font-size: var(--text-xs);
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--muted);
      }
      .chip:hover {
        color: var(--ink);
        border-color: var(--accent);
      }
      .chip .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .chip.is-active {
        color: var(--on-accent);
        background: var(--accent);
        border-color: transparent;
        font-weight: 500;
      }
      .shuffle {
        grid-column: 1 / -1;
        justify-content: center;
        border-style: dashed;
      }

      /* ---------- main ---------- */
      .wrap {
        flex: 1;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding: clamp(var(--s6), 4vw, var(--s10)) clamp(var(--s4), 4vw, var(--s6)) var(--s10);
      }
      h1 {
        font-size: var(--text-2xl);
        line-height: 1.2;
        margin: 0 0 var(--s2);
      }
      .sub {
        margin: 0 0 var(--s8);
        color: var(--muted);
        font-size: var(--text-sm);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: clamp(var(--s5), 3.5vw, var(--s8));
      }
      .out {
        display: flex;
        align-items: center;
        gap: var(--s3);
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: var(--s4);
        min-height: 68px;
      }
      #pw {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-weight: 700;
        font-size: var(--text-lg);
        word-break: break-all;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 11px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
      }
      .icon-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .parts {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
        margin: var(--s4) 0 var(--s6);
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .parts span {
        padding: var(--s1) var(--s3);
        border-radius: 999px;
        background: var(--field);
        font-family: var(--mono);
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
      }
      legend {
        font-size: var(--text-xs);
        letter-spacing: 0.06em;
        color: var(--muted);
        padding: 0 0 var(--s3);
      }
      .cats {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .cat {
        padding: var(--s2) var(--s4);
        font-size: var(--text-sm);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--muted);
      }
      .cat:hover {
        border-color: var(--accent);
        color: var(--ink);
      }
      .cat.is-active {
        color: var(--on-accent);
        background: var(--accent);
        border-color: transparent;
        font-weight: 500;
      }
      .cta {
        width: 100%;
        margin-top: var(--s6);
        padding: var(--s4);
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        font-size: var(--text-sm);
      }
      .cta:hover {
        filter: brightness(1.08);
      }
      .hint {
        min-height: 1.3em;
        margin: var(--s3) 0 0;
        text-align: center;
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .recent {
        margin-top: var(--s8);
      }
      .recent h2 {
        font-size: var(--text-xs);
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 500;
        margin: 0 0 var(--s3);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--s2);
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
        padding: var(--s3) var(--s4);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--panel);
        font-family: var(--mono);
        font-size: var(--text-xs);
        word-break: break-all;
      }
      li.empty {
        justify-content: flex-start;
        border-style: dashed;
        background: transparent;
        color: var(--muted);
        font-family: var(--sans);
      }
      li button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: var(--sans);
        font-size: var(--text-xs);
        flex: 0 0 auto;
      }
      li button:hover {
        color: var(--accent);
      }
      .foot {
        padding: var(--s5) clamp(var(--s4), 4vw, var(--s10));
        border-top: 1px solid var(--border);
        text-align: right;
        color: var(--muted);
        font-size: var(--text-xs);
      }
      .foot strong {
        color: var(--ink);
      }
      @media (max-width: 560px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
        .themes {
          right: auto;
          left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">
        <img class="sai" src="sai.png" width="38" height="38" alt="Sai Baba" />
        Om Sai Ram
      </span>
      <div class="theme-box">
        <button class="theme-btn" id="themeBtn" aria-expanded="false" aria-controls="themes">
          <span id="themeName">Theme: Teal</span>
          <svg class="caret" width="20" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9.5 12 15.5 18 9.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <nav class="themes" id="themes" aria-label="Choose theme" hidden></nav>
      </div>
    </header>

    <main class="wrap">
      <h1>Easy and Strong Password Generator</h1>
      <p class="sub">Please select your category</p>

      <section class="card">
        <div class="out">
          <output id="pw" aria-live="polite">—</output>
          <button class="icon-btn" id="copy" title="Copy" aria-label="Copy">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8" />
              <path d="M15 5.5H6.5A2.5 2.5 0 0 0 4 8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="parts" id="parts" aria-live="polite"></div>

        <fieldset>
          <legend>06 digit name + 01 special character + 06 digit numbers pattern</legend>
          <div class="cats" id="cats"></div>
        </fieldset>

        <button class="cta" id="gen">Generate Password</button>
        <p class="hint" id="hint"></p>
      </section>

      <section class="recent">
        <h2>Recent passwords</h2>
        <ul id="list">
          <li class="empty">Your last 5 passwords will appear here.</li>
        </ul>
      </section>
    </main>

    <canvas id="confetti" aria-hidden="true"></canvas>
    <footer class="foot">Developed by <strong>Deepak Sharma</strong></footer>

    <script>
      const $ = (s) => document.querySelector(s);

      const THEMES = [
        ["midnight", "Midnight", "#4f8cff"],
        ["forest", "Forest", "#4fd18b"],
        ["violet", "Violet", "#a97bff"],
        ["ember", "Ember", "#ff7a45"],
        ["ocean", "Ocean", "#35c6e8"],
        ["rose", "Rose", "#ff5f95"],
        ["amber", "Amber", "#f5c144"],
        ["teal", "Teal", "#2fd6bc"],
        ["slate", "Slate", "#9fb4c7"],
        ["grape", "Grape", "#d267e8"],
      ];
      const PARTY = ["#ff5f95", "#f5c144", "#4fd18b", "#4f8cff", "#d267e8", "#35c6e8", "#ff7a45"];

      const WORDS = {
        animal: ["Monkey", "Rabbit", "Parrot", "Falcon", "Jaguar", "Turtle", "Donkey", "Iguana", "Impala", "Bobcat", "Walrus", "Ferret", "Kitten", "Beagle"],
        hero: ["Batman", "Shazam", "Cyborg", "Vision", "Gambit", "Bishop", "Krrish", "Arjuna", "Shakti", "Rustom", "Bharat", "Ashoka"],
        city: ["Bhopal", "Mumbai", "Indore", "Jaipur", "Kanpur", "Nagpur", "Ranchi", "Raipur", "Rajkot", "Moscow", "Sydney", "Boston", "Vienna", "Zurich", "Dublin", "Madrid"],
        name: ["Deepak", "Sharma", "Aditya", "Ananya", "Kavita", "Ramesh", "Suresh", "Rakesh", "Manish", "Nikhil", "Sanjay", "Vikram", "Ishita", "Sarita", "Rohini", "Kunwar"],
      };
      const CAT_LABELS = { all: "Any", animal: "Animal", hero: "Hero", city: "City", name: "Name" };
      const SPECIALS = "@#$&*!%+?";

      let cat = "all";
      let history = [];

      const rnd = (max) => {
        const buf = new Uint32Array(1);
        const limit = Math.floor(0xffffffff / max) * max;
        let v;
        do {
          crypto.getRandomValues(buf);
          v = buf[0];
        } while (v >= limit);
        return v % max;
      };
      const pick = (arr) => arr[rnd(arr.length)];

      /* ---------- password ---------- */
      function make() {
        const pool = cat === "all" ? Object.values(WORDS).flat() : WORDS[cat];
        const word = pick(pool);
        const sp = SPECIALS[rnd(SPECIALS.length)];
        let digits = "";
        for (let i = 0; i < 6; i++) digits += rnd(10);
        const pw = word + sp + digits;
        $("#pw").textContent = pw;
        $("#parts").innerHTML =
          `<span>${word}</span><span>${sp}</span><span>${digits}</span><span>${pw.length} chars</span>`;
        $("#hint").textContent = "";
        history = [pw, ...history.filter((p) => p !== pw)].slice(0, 5);
        $("#list").innerHTML = history
          .map((p) => `<li><span>${p}</span><button data-p="${encodeURIComponent(p)}">Copy</button></li>`)
          .join("");
      }

      async function copy(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const t = document.createElement("textarea");
          t.value = text;
          document.body.appendChild(t);
          t.select();
          document.execCommand("copy");
          t.remove();
        }
        $("#hint").textContent = "Copied.";
      }

      /* ---------- theme button ---------- */
      let theme = "teal";
      $("#themes").innerHTML =
        THEMES.map(
          ([id, label, dot], i) =>
            `<button class="chip${i === 0 ? " is-active" : ""}" data-theme-id="${id}" aria-pressed="${i === 0}">` +
            `<span class="dot" style="background:${dot}"></span>${label}</button>`
        ).join("") + `<button class="chip shuffle" id="shuffle">Random theme</button>`;

      function setTheme(id) {
        const row = THEMES.find((t) => t[0] === id) || THEMES[0];
        theme = row[0];
        document.documentElement.dataset.theme = theme;
        $("#themeName").textContent = "Theme: " + row[1];
        $("#themes")
          .querySelectorAll("[data-theme-id]")
          .forEach((c) => {
            const on = c.dataset.themeId === theme;
            c.classList.toggle("is-active", on);
            c.setAttribute("aria-pressed", String(on));
          });
      }
      function toggleMenu(open) {
        const menu = $("#themes");
        const show = open === undefined ? menu.hidden : open;
        menu.hidden = !show;
        $("#themeBtn").setAttribute("aria-expanded", String(show));
      }
      $("#themeBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu();
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".theme-box")) toggleMenu(false);
      });
      document.addEventListener("keydown", (e) => e.key === "Escape" && toggleMenu(false));
      $("#themes").addEventListener("click", (e) => {
        const b = e.target.closest("[data-theme-id]");
        if (b) {
          setTheme(b.dataset.themeId);
          toggleMenu(false);
          return;
        }
        if (e.target.closest("#shuffle")) setTheme(pick(THEMES.filter((t) => t[0] !== theme))[0]);
      });

      /* ---------- categories ---------- */
      $("#cats").innerHTML = Object.keys(CAT_LABELS)
        .map(
          (k, i) =>
            `<button class="cat${i === 0 ? " is-active" : ""}" data-cat="${k}" aria-pressed="${i === 0}">${CAT_LABELS[k]}</button>`
        )
        .join("");
      $("#cats").addEventListener("click", (e) => {
        const b = e.target.closest("[data-cat]");
        if (!b) return;
        cat = b.dataset.cat;
        $("#cats")
          .querySelectorAll(".cat")
          .forEach((c) => {
            const on = c === b;
            c.classList.toggle("is-active", on);
            c.setAttribute("aria-pressed", String(on));
          });
        make();
      });

      setTheme(theme);

      $("#gen").addEventListener("click", make);
      $("#copy").addEventListener("click", () => copy($("#pw").textContent));
      $("#list").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-p]");
        if (b) copy(decodeURIComponent(b.dataset.p));
      });
      make();

      /* ---------- light confetti rain (30fps, few pieces) ---------- */
      const cv = $("#confetti");
      const cx = cv.getContext("2d");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let bits = [];
      const R = (a, b) => a + Math.random() * (b - a);

      function sizeCanvas() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }
      const SHAPES = ["rect", "circle", "triangle", "diamond", "ring", "streamer", "star"];
      function newBit(spread) {
        return {
          shape: SHAPES[(Math.random() * SHAPES.length) | 0],
          x: R(0, cv.width),
          y: spread ? R(0, cv.height) : R(-90, -10),
          w: R(6, 11),
          h: R(8, 15),
          vy: R(0.5, 1.5),
          drift: R(-0.3, 0.3),
          rot: R(0, 6.28),
          vr: R(-0.04, 0.04),
          color: PARTY[(Math.random() * PARTY.length) | 0],
        };
      }
      function seed() {
        const n = Math.min(60, Math.round((innerWidth * innerHeight) / 20000));
        bits = Array.from({ length: n }, () => newBit(true));
      }

      function drawBit(b) {
        cx.save();
        cx.translate(b.x, b.y);
        cx.rotate(b.rot);
        cx.fillStyle = b.color;
        cx.strokeStyle = b.color;
        const w = b.w,
