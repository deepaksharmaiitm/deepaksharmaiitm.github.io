<script>
// ----------------- 5 ADVANCED THEME ANIMATION ENGINES -----------------
let currentTheme = 'fireflies';
const canvas = document.getElementById('effectCanvas');
const ctx = canvas.getContext('2d');
let animationFrameId = null;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function switchTheme(themeName) {
    currentTheme = themeName;
    document.body.className = `theme-${themeName}`;
    
    document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.getElementById(`btn-${themeName}`);
    if (activeBtn) activeBtn.classList.add('active');

    localStorage.setItem('preferred_theme', themeName);

    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    
    if (themeName === 'matrix') {
        initMatrix();
    } else if (themeName === 'galaxy') {
        initGalaxy();
    } else if (themeName === 'ocean') {
        initOcean();
    } else if (themeName === 'sakura') {
        initSakura();
    } else {
        initFireflies();
    }
}

// --- 1. FIREFLIES THEME ---
let fireflies = [];
function initFireflies() {
    fireflies = [];
    for (let i = 0; i < 65; i++) {
        fireflies.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1.5,
            speedX: (Math.random() - 0.5) * 0.8,
            speedY: (Math.random() - 0.5) * 0.8,
            alpha: Math.random(),
            pulseSpeed: Math.random() * 0.03 + 0.01,
            color: Math.random() > 0.3 ? '#facc15' : '#4ade80'
        });
    }
    renderFireflies();
}

function renderFireflies() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let f of fireflies) {
        f.x += f.speedX;
        f.y += f.speedY;
        f.alpha += f.pulseSpeed;
        if (f.alpha > 1 || f.alpha < 0.1) f.pulseSpeed = -f.pulseSpeed;

        if (f.x < 0) f.x = canvas.width;
        if (f.x > canvas.width) f.x = 0;
        if (f.y < 0) f.y = canvas.height;
        if (f.y > canvas.height) f.y = 0;

        ctx.save();
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.shadowBlur = 12;
        ctx.shadowColor = f.color;
        ctx.fillStyle = f.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, f.alpha));
        ctx.fill();
        ctx.restore();
    }
    animationFrameId = requestAnimationFrame(renderFireflies);
}

// --- 2. MATRIX NET THEME ---
let matrixColumns = [];
const matrixChars = '0123456789ABCDEF@#$%&*+-/<>~';
const fontSize = 16;
function initMatrix() {
    const columns = Math.floor(canvas.width / fontSize);
    matrixColumns = [];
    for (let i = 0; i < columns; i++) {
        matrixColumns[i] = Math.floor(Math.random() * -50);
    }
    renderMatrix();
}

function renderMatrix() {
    ctx.fillStyle = 'rgba(2, 11, 5, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `${fontSize}px monospace`;

    for (let i = 0; i < matrixColumns.length; i++) {
        const char = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
        const x = i * fontSize;
        const y = matrixColumns[i] * fontSize;

        ctx.fillStyle = '#bbf7d0';
        ctx.fillText(char, x, y);
        ctx.fillStyle = '#22c55e';

        if (y > canvas.height && Math.random() > 0.975) {
            matrixColumns[i] = 0;
        }
        matrixColumns[i]++;
    }
    animationFrameId = requestAnimationFrame(renderMatrix);
}

// --- 3. GALAXY SPACE THEME ---
let stars = [];
let comet = { x: 0, y: 0, length: 0, speed: 0, active: false };
function initGalaxy() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.4,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.005,
            color: Math.random() > 0.4 ? '#e9d5ff' : '#c084fc'
        });
    }
    renderGalaxy();
}

function renderGalaxy() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let s of stars) {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
        ctx.fillStyle = s.color;
        ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // Shooting comet
    if (!comet.active && Math.random() > 0.98) {
        comet = {
            x: Math.random() * canvas.width * 0.8,
            y: Math.random() * canvas.height * 0.3,
            length: Math.random() * 80 + 50,
            speed: Math.random() * 10 + 12,
            active: true
        };
    }
    if (comet.active) {
        ctx.save();
        ctx.strokeStyle = 'rgba(216, 180, 254, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(comet.x, comet.y);
        ctx.lineTo(comet.x - comet.length, comet.y - comet.length * 0.5);
        ctx.stroke();
        ctx.restore();

        comet.x += comet.speed;
        comet.y += comet.speed * 0.5;
        if (comet.x > canvas.width + 100 || comet.y > canvas.height + 100) comet.active = false;
    }

    animationFrameId = requestAnimationFrame(renderGalaxy);
}

// --- 4. DEEP OCEAN THEME ---
let bubbles = [];
function initOcean() {
    bubbles = [];
    for (let i = 0; i < 45; i++) {
        bubbles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 8 + 3,
            speedY: Math.random() * 1.5 + 0.5,
            wiggle: Math.random() * 2,
            wiggleSpeed: Math.random() * 0.05 + 0.02,
            alpha: Math.random() * 0.5 + 0.2
        });
    }
    renderOcean();
}

function renderOcean() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let b of bubbles) {
        b.y -= b.speedY;
        b.wiggle += b.wiggleSpeed;
        const wx = b.x + Math.sin(b.wiggle) * 15;

        if (b.y < -20) {
            b.y = canvas.height + 20;
            b.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(wx, b.y, b.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${b.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = `rgba(56, 189, 248, ${b.alpha * 0.3})`;
        ctx.fill();
        ctx.restore();
    }
    animationFrameId = requestAnimationFrame(renderOcean);
}

// --- 5. SAKURA BLOSSOM PETALS THEME ---
let petals = [];
function initSakura() {
    petals = [];
    for (let i = 0; i < 50; i++) {
        petals.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 8 + 6,
            speedY: Math.random() * 1.4 + 0.8,
            speedX: Math.random() * 1.2 + 0.4,
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 0.04,
            alpha: Math.random() * 0.6 + 0.4
        });
    }
    renderSakura();
}

function renderSakura() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of petals) {
        p.y += p.speedY;
        p.x += Math.sin(p.rotation) * 0.8 + p.speedX;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
        }
        if (p.x > canvas.width + 20) p.x = -20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = `rgba(244, 114, 182, ${p.alpha})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.6, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    animationFrameId = requestAnimationFrame(renderSakura);
}

// ----------------- INDEXED DB FOLDER STORAGE -----------------
let savedDirectoryHandle = null;
const DB_NAME = 'RetGeneratorDB';
const STORE_NAME = 'FolderHandles';

function openHandleDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function loadSavedFolderHandle() {
    try {
        const db = await openHandleDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get('savedDir');
        req.onsuccess = async () => {
            if (req.result) {
                savedDirectoryHandle = req.result;
                const status = await savedDirectoryHandle.queryPermission({ mode: 'readwrite' });
                if (status === 'granted') {
                    document.getElementById("folderDisplay").innerText = `✅ Linked Folder: "${savedDirectoryHandle.name}"`;
                } else {
                    document.getElementById("folderDisplay").innerText = `📁 Saved Folder: "${savedDirectoryHandle.name}" (Click Generate to enable)`;
                }
            }
        };
    } catch (e) {
        console.log("Folder Load error", e);
    }
}

async function selectAndSavePermanentFolder() {
    if (!window.showDirectoryPicker) {
        alert("Aapka browser Direct Folder Picking support nahi karta. Chrome ya Edge ka use karein.");
        return;
    }

    try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        savedDirectoryHandle = dirHandle;

        const db = await openHandleDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(dirHandle, 'savedDir');

        document.getElementById("folderDisplay").innerText = `✅ Linked Folder: "${dirHandle.name}"`;
        alert(`Folder successfully link ho gaya: "${dirHandle.name}"\nAb file seedhe is folder me save hogi!`);
    } catch (err) {
        if (err.name !== 'AbortError') {
            console.error(err);
            alert("Error setting folder: " + err.message);
        }
    }
}

// ----------------- AUTO DATE & FILENAME EXTRACTION -----------------
window.onload = function() {
    setAutomaticFileName();
    const saved = localStorage.getItem('preferred_theme') || 'fireflies';
    switchTheme(saved);
    loadSavedFolderHandle();
};

function setAutomaticFileName(fileCodeSuffix = "01") {
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    const currentDateStr = `${day}${month}${year}`;
    
    document.getElementById("fileName").value = `477844001_${currentDateStr}_14_${fileCodeSuffix}.RET`;
}

function updateFileNameFromFile(uploadFileName) {
    const match = uploadFileName.match(/^C(\d+)/i);
    let suffix = "01";
    if (match && match[1]) {
        suffix = match[1].padStart(2, '0');
    }
    setAutomaticFileName(suffix);
}

// ----------------- NESTED ZIP EXTRACTION -----------------
async function unpackZipRecursively(zipBuffer) {
    const zip = new JSZip();
    const loadedZip = await zip.loadAsync(zipBuffer);
    const fileEntries = Object.keys(loadedZip.files).filter(name => !loadedZip.files[name].dir);

    for (let fileName of fileEntries) {
        if (fileName.toLowerCase().endsWith('.zip')) {
            const innerZipBuffer = await loadedZip.file(fileName).async("arraybuffer");
            return await unpackZipRecursively(innerZipBuffer);
        }
    }

    let targetFileName = fileEntries.find(name => name.toLowerCase().endsWith('.pxf'));

    if (!targetFileName) {
        targetFileName = fileEntries.find(name => 
            name.toLowerCase().endsWith('.txt') || 
            name.toLowerCase().endsWith('.dat') || 
            !name.includes('.')
        );
    }

    if (!targetFileName && fileEntries.length > 0) {
        targetFileName = fileEntries[0];
    }

    if (!targetFileName) {
        throw new Error("ZIP ke andar koi data file nahi mili!");
    }

    const textContent = await loadedZip.file(targetFileName).async("string");
    return {
        fileName: targetFileName,
        content: textContent
    };
}

async function processUploadedFile() {
    const fileInput = document.getElementById('uploadFile');
    const statusDiv = document.getElementById('fileStatus');
    const contentArea = document.getElementById('fileContent');
    
    if (fileInput.files.length === 0) return;

    const file = fileInput.files[0];
    updateFileNameFromFile(file.name);
    
    statusDiv.innerText = `Processing: ${file.name}...`;
    contentArea.value = "";

    try {
        let rawText = "";

        if (file.name.toLowerCase().endsWith('.zip')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await unpackZipRecursively(arrayBuffer);
            statusDiv.innerText = `✅ ZIP Extracted Successfully: ${result.fileName}`;
            rawText = result.content;
        } else {
            rawText = await file.text();
            statusDiv.innerText = `✅ File Loaded: ${file.name}`;
        }

        parseAndPopulateData(rawText);

    } catch (err) {
        console.error(err);
        alert("Error reading file: " + err.message);
        statusDiv.innerText = "❌ Error in reading file!";
    }
}

function parseAndPopulateData(text) {
    const lines = text.split(/\r?\n/);
    let outputLines = [];

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line === "") continue;

        let values = line.split('|');

        if (values.length >= 6) {
            let val2 = values[1] ? values[1].trim() : "";
            let val3 = values[2] ? values[2].trim() : "";
            let val5 = values[4] ? values[4].trim() : ""; 
            let val8 = values[7] ? values[7].trim() : (values[3] ? values[3].trim() : "");
            let fixed00 = "--";
            
            let val20 = "";
            if (values.length >= 20) {
                val20 = values[19] ? values[19].trim() : "";
            } else {
                val20 = values[values.length - 1] ? values[values.length - 1].trim() : "";
            }

            let newLine = `${val2}|${val5}|${val3}|${val8}|${fixed00}|${val20}`;
            outputLines.push(newLine);
        }
    }

    if (outputLines.length === 0) {
        alert("Warning: Valid delimiter '|' match nahi hua!");
    }

    document.getElementById('fileContent').value = outputLines.join('\r\n');
}

// ----------------- DIRECT GENERATE & AUTO-SAVE -----------------
async function autoGenerateAndSave() {
    const fileName = document.getElementById("fileName").value.trim();
    const fileContent = document.getElementById("fileContent").value;

    if (!fileContent) {
        alert("Pehle .ZIP ya .PXF file select karein!");
        return;
    }

    if (savedDirectoryHandle) {
        try {
            const perm = await savedDirectoryHandle.requestPermission({ mode: 'readwrite' });
            if (perm === 'granted') {
                const fileHandle = await savedDirectoryHandle.getFileHandle(fileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(fileContent);
                await writable.close();
                alert(`🎉 File bina kisi pop-up ke aapke linked folder "${savedDirectoryHandle.name}" mein save ho gayi!\nFile: ${fileName}`);
                return;
            }
        } catch (e) {
            console.warn("Direct folder save fallback", e);
        }
    }

    const blob = new Blob([fileContent], {type: "text/plain;charset=utf-8"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    
    alert(`File Downloaded: ${fileName}`);
}
