<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline File Manager</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;justify-content:center;align-items:center;padding:25px;
}
.container{
  width:min(950px,100%);background:rgba(255,255,255,.96);
  border-radius:22px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.25)
}
h1{text-align:center;margin:0 0 8px;color:#222}
.subtitle{text-align:center;color:#666;margin-bottom:25px}
.upload-area{
  border:2px dashed #667eea;border-radius:18px;padding:30px;text-align:center;
  background:#f7f8ff;cursor:pointer;transition:.2s
}
.upload-area:hover{background:#eef0ff}
input[type=file]{display:none}
.upload-btn,.action{
  border:0;border-radius:10px;padding:10px 16px;color:#fff;font-weight:bold;
  cursor:pointer;font-size:14px
}
.upload-btn{background:#667eea;margin-top:12px}
.file-list{margin-top:25px}
.file-item{
  display:flex;align-items:center;gap:15px;padding:15px;margin-bottom:12px;
  border-radius:14px;background:#f5f5f5;border:1px solid #e4e4e4
}
.file-icon{font-size:28px;width:42px;text-align:center}
.file-info{flex:1;min-width:0}
.file-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:12px;color:#777;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.view{background:#17a673}.download{background:#3478db}.delete{background:#e04b4b}
.empty{text-align:center;color:#777;padding:30px}
.status{text-align:center;margin-top:15px;color:#555;font-size:13px}
@media(max-width:650px){
  .file-item{align-items:flex-start;flex-wrap:wrap}
  .file-info{width:calc(100% - 60px)}
  .actions{width:100%;padding-left:57px}
}
</style>
</head>
<body>
<div class="container">
  <h1>📁 Offline File Manager</h1>
  <div class="subtitle">Upload, View, Download & Delete your files</div>

  <label class="upload-area" for="fileInput">
    <div style="font-size:42px">📤</div>
    <h3>Click here to select files</h3>
    <div>Files are stored locally in this browser.</div>
    <span class="upload-btn">Choose Files</span>
  </label>
  <input id="fileInput" type="file" multiple>

  <div class="status" id="status"></div>
  <div class="file-list" id="fileList"></div>
</div>

<script>
const DB_NAME = "OfflineFileManagerDB";
const STORE_NAME = "files";
let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const database=e.target.result;
      if(!database.objectStoreNames.contains(STORE_NAME)){
        database.createObjectStore(STORE_NAME,{keyPath:"id",autoIncrement:true});
      }
    };
    req.onsuccess=e=>{db=e.target.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}

function addFile(file){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,"readwrite");
    tx.objectStore(STORE_NAME).add({
      name:file.name,type:file.type,size:file.size,blob:file,
      date:new Date().toISOString()
    });
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}

function getFiles(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,"readonly");
    const req=tx.objectStore(STORE_NAME).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

function deleteFile(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,"readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}

function getFile(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,"readonly");
    const req=tx.objectStore(STORE_NAME).get(id);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

function formatSize(bytes){
  if(bytes<1024)return bytes+" B";
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
  return (bytes/1024/1024).toFixed(2)+" MB";
}

function icon(type,name){
  if(type.includes("pdf") || name.toLowerCase().endsWith(".pdf")) return "📕";
  if(type.startsWith("image/")) return "🖼️";
  if(type.includes("word") || /\.(doc|docx)$/i.test(name)) return "📘";
  if(type.includes("sheet") || /\.(xls|xlsx)$/i.test(name)) return "📗";
  return "📄";
}

async function render(){
  const files=await getFiles();
  const list=document.getElementById("fileList");
  if(!files.length){
    list.innerHTML='<div class="empty">No files uploaded yet.</div>';
    return;
  }
  list.innerHTML=files.map(f=>`
    <div class="file-item">
      <div class="file-icon">${icon(f.type,f.name)}</div>
      <div class="file-info">
        <div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
        <div class="file-meta">${formatSize(f.size)} • ${new Date(f.date).toLocaleString()}</div>
      </div>
      <div class="actions">
        <button class="action view" onclick="viewFile(${f.id})">View</button>
        <button class="action download" onclick="downloadFile(${f.id})">Download</button>
        <button class="action delete" onclick="removeFile(${f.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function viewFile(id){
  const f=await getFile(id);
  if(!f)return;
  const url=URL.createObjectURL(f.blob);
  window.open(url,"_blank");
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

async function downloadFile(id){
  const f=await getFile(id);
  if(!f)return;
  const url=URL.createObjectURL(f.blob);
  const a=document.createElement("a");
  a.href=url;a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function removeFile(id){
  const f=await getFile(id);
  if(!f)return;
  if(confirm("Delete this file?\n\n"+f.name)){
    await deleteFile(id);
    document.getElementById("status").textContent="File deleted successfully.";
    render();
  }
}

document.getElementById("fileInput").addEventListener("change",async e=>{
  const files=[...e.target.files];
  if(!files.length)return;
  const status=document.getElementById("status");
  try{
    for(const file of files) await addFile(file);
    status.textContent=files.length+" file(s) uploaded successfully.";
    await render();
  }catch(err){
    status.textContent="Could not save file: "+err.message;
  }
  e.target.value="";
});

openDB().then(render).catch(err=>{
  document.getElementById("status").textContent="Browser storage could not be opened.";
});
</script>
</body>
</html>
