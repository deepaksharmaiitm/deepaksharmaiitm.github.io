<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vista File Transfer</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow-x:hidden;background:#090b1a}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#5b21b655,transparent 35%),radial-gradient(circle at 80% 80%,#0891b255,transparent 35%),linear-gradient(135deg,#090b1a,#111827)}
.wrap{width:min(720px,94%);margin:45px auto}
.card{padding:28px;border:1px solid #ffffff2d;border-radius:25px;background:#ffffff12;backdrop-filter:blur(18px);box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px;text-align:center;font-size:32px}
.sub{text-align:center;color:#cbd5e1;margin-bottom:25px}
.themes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
button,.file-label{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;color:white;background:linear-gradient(135deg,#2563eb,#7c3aed)}
button:hover,.file-label:hover{transform:translateY(-1px);filter:brightness(1.08)}
.filebox{padding:25px;border:2px dashed #ffffff44;border-radius:18px;text-align:center}
input[type=file]{display:none}
#filename{margin:15px 0;color:#dbeafe;word-break:break-word}
.progress{height:12px;background:#ffffff18;border-radius:99px;overflow:hidden;margin:18px 0}
#bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:.2s}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result{margin-top:20px;padding:15px;border-radius:14px;background:#0004;display:none}
.link{word-break:break-all;color:#93c5fd}
.status{text-align:center;margin-top:15px;min-height:24px;color:#bfdbfe}
small{display:block;text-align:center;color:#94a3b8;margin-top:18px}
</style>
</head>
<body>
<div class="bg"></div><canvas id="fx"></canvas>
<div class="wrap"><div class="card">
<h1>📁 Vista File Transfer</h1>
<div class="sub">Upload and share files up to 5 MB</div>

<div class="themes">
<button onclick="theme(0)">🌌 Space</button>
<button onclick="theme(1)">🔥 Fire</button>
<button onclick="theme(2)">🌊 Ocean</button>
<button onclick="theme(3)">🌿 Green</button>
<button onclick="theme(4)">🌸 Violet</button>
</div>

<div class="filebox">
<label class="file-label" for="file">📂 Choose File</label>
<input id="file" type="file" onchange="picked()">
<div id="filename">No file selected</div>
<div class="actions">
<button onclick="uploadFile()">⬆ Upload</button>
<button onclick="downloadFile()">⬇ Download</button>
<button onclick="copyLink()">🔗 Copy Link</button>
<button onclick="location.href='index.html'">← Back to Home</button>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="status" id="status">Maximum file size: 5 MB</div>
</div>

<div class="result" id="result">
<b>Shareable Download Link</b>
<div class="link" id="shareLink"></div>
</div>
<small>Storage setup is required before Upload/Download can work.</small>
</div></div>

<script>
/*
  SUPABASE SETUP:
  Replace the two placeholders below with your Supabase Project URL
  and Publishable/Anon key. Create a Storage bucket named "files".
*/
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const BUCKET="files";
let selectedFile=null, uploadedUrl="";

const s=document.createElement("script");
s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
s.onload=()=>window.sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
document.head.appendChild(s);

function picked(){
 selectedFile=document.getElementById("file").files[0];
 if(!selectedFile)return;
 document.getElementById("filename").textContent=selectedFile.name+" • "+(selectedFile.size/1024/1024).toFixed(2)+" MB";
 if(selectedFile.size>5*1024*1024){document.getElementById("status").textContent="❌ File is larger than 5 MB";selectedFile=null;return}
 document.getElementById("status").textContent="✅ File ready to upload";
}
async function uploadFile(){
 if(!selectedFile)return msg("Please choose a file first.");
 if(!window.sb)return msg("Supabase is not configured yet.");
 const safe=selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=Date.now()+"_"+crypto.randomUUID()+"_"+safe;
 msg("Uploading...");
 document.getElementById("bar").style.width="35%";
 const {error}=await sb.storage.from(BUCKET).upload(path,selectedFile,{contentType:selectedFile.type||"application/octet-stream",upsert:false});
 if(error){msg("❌ Upload failed: "+error.message);document.getElementById("bar").style.width="0";return}
 const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
 uploadedUrl=data.publicUrl+"?download="+encodeURIComponent(selectedFile.name);
 document.getElementById("shareLink").textContent=uploadedUrl;
 document.getElementById("result").style.display="block";
 document.getElementById("bar").style.width="100%";
 msg("✅ Upload complete. Copy the link and open it on another computer.");
}
function downloadFile(){
 if(!uploadedUrl)return msg("Upload a file first.");
 location.href=uploadedUrl;
}
async function copyLink(){
 if(!uploadedUrl)return msg("Upload a file first.");
 await navigator.clipboard.writeText(uploadedUrl);
 msg("🔗 Download link copied.");
}
function msg(t){document.getElementById("status").textContent=t}
function theme(n){
 const b=document.querySelector(".bg");
 const x=[
 "radial-gradient(circle at 20% 20%,#5b21b655,transparent 35%),radial-gradient(circle at 80% 80%,#0891b255,transparent 35%),linear-gradient(135deg,#090b1a,#111827)",
 "radial-gradient(circle at 20% 20%,#ef444455,transparent 35%),radial-gradient(circle at 80% 80%,#f9731655,transparent 35%),linear-gradient(135deg,#180b0b,#27100b)",
 "radial-gradient(circle at 20% 20%,#06b6d455,transparent 35%),radial-gradient(circle at 80% 80%,#2563eb55,transparent 35%),linear-gradient(135deg,#06131c,#071b36)",
 "radial-gradient(circle at 20% 20%,#22c55e55,transparent 35%),radial-gradient(circle at 80% 80%,#14b8a655,transparent 35%),linear-gradient(135deg,#06150d,#08251d)",
 "radial-gradient(circle at 20% 20%,#ec489955,transparent 35%),radial-gradient(circle at 80% 80%,#8b5cf655,transparent 35%),linear-gradient(135deg,#17091b,#160d2d)"
 ]; b.style.background=x[n];
}
const c=document.getElementById("fx"),ctx=c.getContext("2d");let p=[];
function resize(){c.width=innerWidth;c.height=innerHeight;p=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+1,v:Math.random()*.5+.1}))}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#ffffff66";p.forEach(a=>{a.y-=a.v;if(a.y<0)a.y=c.height;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(draw)}
addEventListener("resize",resize);resize();draw();
</script>
</body>
</html>
