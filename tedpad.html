<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taj Mahal Heritage Tablet - Ruled Notebook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper-bg: #ffffff;
      --line-color: #cbd5e1;
      --margin-line: #ef4444;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      background-image: url('pexels-axp-photography-500641970-16386145.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Outfit', sans-serif;
      position: relative;
    }

    /* Royal Marble Frame */
    .heritage-frame {
      width: 100%;
      max-width: 900px;
      height: 700px;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
      padding: 16px;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85), 0 0 0 4px rgba(255, 255, 255, 0.8);
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
    }

    .frame-inner {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 18px;
      border: 2px solid #94a3b8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.08);
    }

    /* Top Toolbar */
    .toolbar-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #f8fafc;
      border-bottom: 1.5px solid #cbd5e1;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-title {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Page Color Picker */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #e2e8f0;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .color-picker-label {
      font-size: 11px;
      font-weight: 700;
      color: #334155;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.2);
    }

    /* Action Buttons */
    .btn {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.95); }
    .btn-add { background: #0284c7; color: #fff; }
    .btn-add:hover { background: #0369a1; }
    .btn-save { background: #16a34a; color: #fff; }
    .btn-save:hover { background: #15803d; }
    .btn-export { background: #475569; color: #fff; }
    .btn-export:hover { background: #334155; }

    /* Ruled Writing Lines Area */
    .lines-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 10px 42px;
      background-color: var(--paper-bg);
      background-image: linear-gradient(90deg, transparent 34px, var(--margin-line) 35px, var(--margin-line) 36px, transparent 37px);
      background-size: 100% 100%;
      background-attachment: local;
      transition: background-color 0.3s ease;
    }

    /* Note Row */
    .note-line {
      display: flex;
      align-items: center;
      min-height: 34px;
      border-bottom: 1px solid var(--line-color);
      position: relative;
    }

    .note-line:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    .line-number {
      position: absolute;
      left: -34px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      width: 22px;
      text-align: right;
      user-select: none;
    }

    .line-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Kalam', 'Caveat', cursive, sans-serif;
      font-size: 18px;
      color: var(--text-color);
      padding: 2px 8px;
      line-height: 26px;
    }

    /* Line Delete Button */
    .btn-line-delete {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 4px;
      width: 22px;
      height: 22px;
      font-size: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      opacity: 0.35;
      transition: all 0.2s;
    }

    .note-line:hover .btn-line-delete { opacity: 1; }
    .btn-line-delete:hover { background: #ef4444; color: #fff; transform: scale(1.1); }

    /* Toast Alert */
    #toast {
      position: fixed;
      bottom: 20px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      z-index: 99;
    }
  </style>
</head>
<body>

  <!-- Tablet Frame -->
  <div class="heritage-frame">
    <div class="frame-inner">
      
      <!-- Toolbar with Page Color Switcher -->
      <div class="toolbar-bar">
        <span class="toolbar-title">🕌 Heritage Notebook</span>
        
        <div class="toolbar-actions">
          <div class="color-picker-wrapper">
            <span class="color-picker-label">🎨 Page:</span>
            <div class="color-swatch" style="background:#ffffff;" title="Pure White" onclick="setPageColor('#ffffff', '#1e293b', '#cbd5e1', '#ef4444')"></div>
            <div class="color-swatch" style="background:#fffbf0;" title="Parchment Cream" onclick="setPageColor('#fffbf0', '#1e293b', '#e2e8f0', '#ef4444')"></div>
            <div class="color-swatch" style="background:#fef9c3;" title="Soft Yellow" onclick="setPageColor('#fef9c3', '#713f12', '#fde047', '#f87171')"></div>
            <div class="color-swatch" style="background:#dcfce7;" title="Pastel Green" onclick="setPageColor('#dcfce7', '#14532d', '#86efac', '#ef4444')"></div>
            <div class="color-swatch" style="background:#e0f2fe;" title="Pastel Blue" onclick="setPageColor('#e0f2fe', '#0c4a6e', '#7dd3fc', '#f87171')"></div>
            <div class="color-swatch" style="background:#fce7f3;" title="Pastel Pink" onclick="setPageColor('#fce7f3', '#831843', '#f472b6', '#ef4444')"></div>
          </div>

          <button class="btn btn-add" onclick="addNewLine('', true)">➕ Add</button>
          <button class="btn btn-save" onclick="saveLines()">💾 Save</button>
          <button class="btn btn-export" onclick="exportLines()">⬇️ Export</button>
        </div>
      </div>

      <!-- Ruled Writing Area -->
      <div class="lines-container" id="linesContainer"></div>

    </div>
  </div>

  <div id="toast"></div>

  <script>
    const linesContainer = document.getElementById('linesContainer');
    const toast = document.getElementById('toast');

    // Page Color Changer
    function setPageColor(bgColor, textColor, lineColor, marginColor) {
      document.documentElement.style.setProperty('--paper-bg', bgColor);
      document.documentElement.style.setProperty('--text-color', textColor);
      document.documentElement.style.setProperty('--line-color', lineColor);
      document.documentElement.style.setProperty('--margin-line', marginColor);

      localStorage.setItem('taj_page_bg', bgColor);
      localStorage.setItem('taj_page_text', textColor);
      localStorage.setItem('taj_page_line', lineColor);
      localStorage.setItem('taj_page_margin', marginColor);
      showToast('🎨 पेज का रंग बदल दिया गया!');
    }

    // Add New Line
    function addNewLine(text = '', autoFocus = false) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'note-line';

      lineDiv.innerHTML = `
        <span class="line-number"></span>
        <input type="text" class="line-input" value="${text.replace(/"/g, '&quot;')}" placeholder="">
        <button class="btn-line-delete" title="यह लाइन हटाएं" onclick="deleteSingleLine(this)">🗑️</button>
      `;

      const input = lineDiv.querySelector('.line-input');
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const nextLine = addNewLine('', true);
          lineDiv.after(nextLine);
          reindexLines();
        } else if (e.key === 'Backspace' && input.value === '' && linesContainer.children.length > 1) {
          e.preventDefault();
          const prev = lineDiv.previousElementSibling;
          lineDiv.remove();
          reindexLines();
          if (prev) {
            const prevInput = prev.querySelector('.line-input');
            prevInput.focus();
            prevInput.selectionStart = prevInput.selectionEnd = prevInput.value.length;
          }
        }
      });

      input.addEventListener('input', autoSaveLines);
      linesContainer.appendChild(lineDiv);
      reindexLines();

      if (autoFocus) input.focus();
      return lineDiv;
    }

    // Delete Single Line
    function deleteSingleLine(btn) {
      const line = btn.closest('.note-line');
      line.remove();

      if (linesContainer.children.length === 0) {
        addNewLine('', true);
      }
      reindexLines();
      autoSaveLines();
      showToast('🗑️ लाइन हटा दी गई!');
    }

    // Numbering lines (1, 2, 3...)
    function reindexLines() {
      const lines = linesContainer.querySelectorAll('.note-line');
      lines.forEach((line, index) => {
        line.querySelector('.line-number').innerText = index + 1;
      });
    }

    // Save locally
    function autoSaveLines() {
      const texts = [];
      linesContainer.querySelectorAll('.line-input').forEach(inp => {
        texts.push(inp.value);
      });
      localStorage.setItem('taj_board_lines', JSON.stringify(texts));
    }

    function saveLines() {
      autoSaveLines();
      showToast('✅ सभी लाइनें सुरक्षित (Saved) कर ली गईं!');
    }

    // Download/Export text file
    function exportLines() {
      const lines = [];
      linesContainer.querySelectorAll('.line-input').forEach((inp, idx) => {
        if (inp.value.trim() !== '') {
          lines.push(`${idx + 1}. ${inp.value}`);
        }
      });

      if (lines.length === 0) {
        showToast('⚠️ पहले कुछ लिखें!');
        return;
      }

      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Heritage_Notes.txt';
      link.click();
      showToast('📥 फाइल डाउनलोड हो गई!');
    }

    // Load on start
    window.addEventListener('DOMContentLoaded', () => {
      // Restore Page Colors
      const savedBg = localStorage.getItem('taj_page_bg');
      const savedText = localStorage.getItem('taj_page_text');
      const savedLine = localStorage.getItem('taj_page_line');
      const savedMargin = localStorage.getItem('taj_page_margin');
      if (savedBg && savedText && savedLine && savedMargin) {
        setPageColor(savedBg, savedText, savedLine, savedMargin);
      }

      // Restore Lines
      const saved = localStorage.getItem('taj_board_lines');
      if (saved) {
        try {
          const arr = JSON.parse(saved);
          if (Array.isArray(arr) && arr.length > 0) {
            arr.forEach(txt => addNewLine(txt, false));
            return;
          }
        } catch (e) {}
      }

      for (let i = 0; i < 9; i++) {
        addNewLine('', false);
      }
    });

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
  </script>
</body>
</html>
