<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planted Aquarium Tablet - Cloud Synced Notebook</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --tablet-body: #ffffff;
      --paper-bg: #ffffff;
      --line-color: #cbd5e1;
      --margin-line: #f87171;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #0e3d2f 0%, #061f18 45%, #020a08 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .aquarium-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at 50% -10%, rgba(74, 222, 128, 0.2) 0%, rgba(14, 116, 144, 0.1) 50%, transparent 85%);
      pointer-events: none;
      z-index: 1;
    }

    #aquariumCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .tablet-device {
      width: 100%;
      max-width: 860px;
      height: 740px;
      background: #ffffff;
      border-radius: 36px;
      padding: 14px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 0 8px #e2e8f0, 0 0 0 12px #94a3b8;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    .tablet-header-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 8px;
      gap: 10px;
    }

    .camera-dot {
      width: 8px;
      height: 8px;
      background: #334155;
      border-radius: 50%;
    }

    .speaker-slot {
      width: 40px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 4px;
    }

    .tablet-screen {
      flex: 1;
      background: var(--paper-bg);
      border-radius: 20px;
      border: 1.5px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .notepad-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: rgba(248, 250, 252, 0.95);
      border-bottom: 1.5px solid #e2e8f0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tablet-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .color-picker-label {
      font-size: 11px;
      font-weight: 700;
      color: #334155;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .color-swatch:hover { transform: scale(1.2); }

    .color-custom-input {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .action-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .action-btn:active { transform: scale(0.96); }
    .btn-add { background: #0284c7; color: #fff; }
    .btn-save-cloud { background: #16a34a; color: #fff; }
    .btn-export { background: #475569; color: #fff; }

    .notepad-container {
      flex: 1;
      position: relative;
      background: var(--paper-bg);
      overflow-y: auto;
      padding: 15px 15px 15px 45px;
      background-image: linear-gradient(90deg, transparent 38px, var(--margin-line) 39px, var(--margin-line) 40px, transparent 41px);
      background-size: 100% 100%;
      background-attachment: local;
      transition: background 0.3s ease;
    }

    .note-line {
      display: flex;
      align-items: center;
      min-height: 38px;
      border-bottom: 1px solid var(--line-color);
      position: relative;
      transition: background 0.15s ease;
    }

    .note-line:hover { background: rgba(0, 0, 0, 0.03); }

    .line-number {
      position: absolute;
      left: -32px;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      width: 22px;
      text-align: right;
      user-select: none;
    }

    .line-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Kalam', 'Caveat', cursive, sans-serif;
      font-size: 19px;
      color: var(--text-color);
      padding: 4px 8px 4px 10px;
      line-height: 28px;
    }

    .btn-line-delete {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-right: 6px;
      opacity: 0.35;
      transition: all 0.2s;
    }

    .note-line:hover .btn-line-delete { opacity: 1; }
    .btn-line-delete:hover { background: #ef4444; color: #ffffff; transform: scale(1.1); }

    .tablet-footer-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 8px;
    }

    .home-bar {
      width: 120px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 4px;
    }

    #toast {
      position: fixed;
      bottom: 25px;
      background: rgba(6, 31, 24, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(74, 222, 128, 0.5);
      color: #dcfce7;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      z-index: 99;
    }
  </style>
</head>
<body>

  <div class="aquarium-light"></div>
  <canvas id="aquariumCanvas"></canvas>

  <div class="tablet-device">
    <div class="tablet-header-bar">
      <div class="camera-dot"></div>
      <div class="speaker-slot"></div>
    </div>

    <div class="tablet-screen">
      <div class="notepad-toolbar">
        <span class="tablet-title">🌿 Cloud Aquarium Tablet</span>
        <div class="action-btn-group">
          
          <div class="color-picker-wrapper">
            <span class="color-picker-label">🎨 Page:</span>
            <div class="color-swatch" style="background:#ffffff;" title="White" onclick="setPageColor('#ffffff', '#1e293b', '#cbd5e1')"></div>
            <div class="color-swatch" style="background:#fef9c3;" title="Yellow" onclick="setPageColor('#fef9c3', '#713f12', '#fde047')"></div>
            <div class="color-swatch" style="background:#dcfce7;" title="Green" onclick="setPageColor('#dcfce7', '#14532d', '#86efac')"></div>
            <div class="color-swatch" style="background:#e0f2fe;" title="Blue" onclick="setPageColor('#e0f2fe', '#0c4a6e', '#7dd3fc')"></div>
            <div class="color-swatch" style="background:#fce7f3;" title="Pink" onclick="setPageColor('#fce7f3', '#831843', '#f472b6')"></div>
            <input type="color" class="color-custom-input" title="Custom Color" onchange="setCustomPageColor(this.value)">
          </div>

          <button class="action-btn btn-add" onclick="addNewLine('', true)">➕ Line</button>
          <button class="action-btn btn-save-cloud" id="saveCloudBtn" onclick="saveLinesOnline()">☁️ Save Online</button>
          <button class="action-btn btn-export" onclick="exportLines()">⬇️ Export</button>
        </div>
      </div>

      <div class="notepad-container" id="linesContainer"></div>
    </div>

    <div class="tablet-footer-bar">
      <div class="home-bar"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // Updated Live Apps Script Endpoint
    const CLOUD_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhrWQHT6QgIGR7HwfM7Y6B9nxlTPC30Or_VZhKUg73CoIeFMihsePKiMHg_Lc2d1lijg/exec";

    /* --- Aquarium Engine --- */
    const canvas = document.getElementById('aquariumCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const TROPICAL_SPECIES = [
      { name: 'Discus', primary: '#f97316', secondary: '#38bdf8', accent: '#0f172a', stripes: true, tailLength: 1.1, bodyRatio: 0.75 },
      { name: 'Electric Blue', primary: '#0284c7', secondary: '#38bdf8', accent: '#facc15', stripes: false, tailLength: 1.25, bodyRatio: 0.55 },
      { name: 'Tiger Barb', primary: '#fbbf24', secondary: '#ea580c', accent: '#1e293b', stripes: true, tailLength: 1.2, bodyRatio: 0.6 },
      { name: 'Fire Cichlid', primary: '#dc2626', secondary: '#f97316', accent: '#7f1d1d', stripes: false, tailLength: 1.3, bodyRatio: 0.5 },
      { name: 'Angelfish', primary: '#e2e8f0', secondary: '#facc15', accent: '#334155', stripes: true, tailLength: 1.4, bodyRatio: 0.8 }
    ];

    class RealFish {
      constructor(sizeCategory = null) {
        this.sizeCategory = sizeCategory;
        this.reset();
      }

      reset() {
        this.species = TROPICAL_SPECIES[Math.floor(Math.random() * TROPICAL_SPECIES.length)];
        const category = this.sizeCategory || (Math.random() < 0.25 ? 'big' : Math.random() < 0.65 ? 'medium' : 'small');
        
        if (category === 'big') {
          this.length = Math.random() * 12 + 42;
          this.baseSpeed = Math.random() * 0.35 + 0.35;
        } else if (category === 'medium') {
          this.length = Math.random() * 10 + 26;
          this.baseSpeed = Math.random() * 0.45 + 0.45;
        } else {
          this.length = Math.random() * 6 + 14;
          this.baseSpeed = Math.random() * 0.6 + 0.6;
        }

        this.height = this.length * this.species.bodyRatio;
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.x = this.direction === 1 ? -90 : canvas.width + 90;
        this.y = Math.random() * (canvas.height - 140) + 60;
        this.speedX = this.baseSpeed * this.direction;
        this.speedY = Math.random() * 0.2 - 0.1;
        this.wiggle = Math.random() * Math.PI * 2;
        this.wiggleSpeed = (category === 'small' ? 0.12 : category === 'big' ? 0.05 : 0.08);
      }

      update() {
        this.x += this.speedX;
        this.y += Math.sin(this.wiggle * 0.5) * 0.25 + this.speedY;
        this.wiggle += this.wiggleSpeed;
        if (this.direction === 1 && this.x > canvas.width + 100) this.reset();
        if (this.direction === -1 && this.x < -100) this.reset();
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.direction === -1) ctx.scale(-1, 1);

        const L = this.length;
        const H = this.height;
        const sway = Math.sin(this.wiggle) * (L * 0.2);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.beginPath();
        ctx.moveTo(-L * 0.1, -H * 0.45);
        ctx.quadraticCurveTo(-L * 0.3, -H * 1.0, -L * 0.6, -H * 0.2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-L * 0.2, H * 0.4);
        ctx.quadraticCurveTo(-L * 0.4, H * 0.85, -L * 0.55, H * 0.2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-L * 0.7, 0);
        ctx.quadraticCurveTo(-L * (this.species.tailLength + 0.1), -H * 0.8 + sway, -L * this.species.tailLength, sway);
        ctx.quadraticCurveTo(-L * (this.species.tailLength + 0.1), H * 0.8 + sway, -L * 0.7, 0);
        ctx.fillStyle = this.species.secondary;
        ctx.fill();

        const grad = ctx.createRadialGradient(L * 0.15, -H * 0.1, H * 0.1, 0, 0, L);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, this.species.primary);
        grad.addColorStop(1, this.species.accent);

        ctx.beginPath();
        ctx.moveTo(L * 0.85, 0);
        ctx.bezierCurveTo(L * 0.6, -H * 0.7, -L * 0.4, -H * 0.65, -L * 0.75, 0);
        ctx.bezierCurveTo(-L * 0.4, H * 0.65, L * 0.6, H * 0.7, L * 0.85, 0);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        if (this.species.stripes) {
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.75)';
          ctx.lineWidth = L * 0.09;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(L * 0.15, -H * 0.45);
          ctx.lineTo(L * 0.1, H * 0.45);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(L * 0.55, -H * 0.1, H * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(L * 0.55, -H * 0.1, H * 0.1, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.restore();
      }
    }

    class Bubble {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.r = Math.random() * 4 + 2.5;
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 15;
        this.speedY = Math.random() * 1.3 + 0.7;
        this.sway = Math.random() * 1.0 + 0.3;
        this.angle = Math.random() * Math.PI * 2;
        this.opacity = Math.random() * 0.4 + 0.3;
      }
      update() {
        this.y -= this.speedY;
        this.angle += 0.03;
        this.x += Math.sin(this.angle) * (this.sway * 0.35);
        if (this.y < -15) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = 'rgba(74, 222, 128, 0.15)';
        ctx.fill();
        ctx.restore();
      }
    }

    const fishList = [];
    const bubbleList = [];
    for (let i = 0; i < 3; i++) fishList.push(new RealFish('big'));
    for (let i = 0; i < 5; i++) fishList.push(new RealFish('medium'));
    for (let i = 0; i < 6; i++) fishList.push(new RealFish('small'));
    for (let i = 0; i < 22; i++) bubbleList.push(new Bubble());

    function animateAquarium() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bubbleList.forEach(b => { b.update(); b.draw(); });
      fishList.forEach(f => { f.update(); f.draw(); });
      requestAnimationFrame(animateAquarium);
    }
    animateAquarium();

    /* --- Tablet & Notebook Core Logic --- */
    const linesContainer = document.getElementById('linesContainer');
    const toast = document.getElementById('toast');

    function setPageColor(bgColor, textColor, lineColor) {
      document.documentElement.style.setProperty('--paper-bg', bgColor);
      document.documentElement.style.setProperty('--text-color', textColor);
      document.documentElement.style.setProperty('--line-color', lineColor);
      localStorage.setItem('aquarium_page_bg', bgColor);
      localStorage.setItem('aquarium_page_text', textColor);
      localStorage.setItem('aquarium_page_line', lineColor);
      showToast('🎨 रंग बदल दिया गया!');
    }

    function setCustomPageColor(colorHex) {
      setPageColor(colorHex, '#1e293b', '#cbd5e1');
    }

    function addNewLine(text = '', autoFocus = false) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'note-line';

      lineDiv.innerHTML = `
        <span class="line-number"></span>
        <input type="text" class="line-input" value="${text.replace(/"/g, '&quot;')}" placeholder="">
        <button class="btn-line-delete" title="यह लाइन हटाएं" onclick="deleteSingleLine(this)">🗑️</button>
      `;

      const input = lineDiv.querySelector('.line-input');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const nextLine = addNewLine('', true);
          lineDiv.after(nextLine);
          reindexLines();
        } else if (e.key === 'Backspace' && input.value === '' && linesContainer.children.length > 1) {
          e.preventDefault();
          const prev = lineDiv.previousElementSibling;
          lineDiv.remove();
          reindexLines();
          if (prev) {
            const prevInput = prev.querySelector('.line-input');
            prevInput.focus();
            prevInput.selectionStart = prevInput.selectionEnd = prevInput.value.length;
          }
        }
      });

      input.addEventListener('input', autoSaveLinesLocal);
      linesContainer.appendChild(lineDiv);
      reindexLines();

      if (autoFocus) input.focus();
      return lineDiv;
    }

    function deleteSingleLine(btn) {
      const line = btn.closest('.note-line');
      line.remove();

      if (linesContainer.children.length === 0) {
        addNewLine('', true);
      }
      reindexLines();
      autoSaveLinesLocal();
      showToast('🗑️ लाइन हटा दी गई!');
    }

    function reindexLines() {
      const lines = linesContainer.querySelectorAll('.note-line');
      lines.forEach((line, index) => {
        line.querySelector('.line-number').innerText = index + 1;
      });
    }

    function getLinesArray() {
      const texts = [];
      linesContainer.querySelectorAll('.line-input').forEach(inp => {
        texts.push(inp.value);
      });
      return texts;
    }

    function autoSaveLinesLocal() {
      localStorage.setItem('aquarium_notebook_lines', JSON.stringify(getLinesArray()));
    }

    function saveLinesOnline() {
      const texts = getLinesArray();
      const saveBtn = document.getElementById('saveCloudBtn');
      saveBtn.innerText = "⏳ Saving...";
      saveBtn.disabled = true;

      autoSaveLinesLocal();

      fetch(CLOUD_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(texts)
      })
      .then(() => {
        showToast('☁️ डेटा ऑनलाइन Cloud पर सुरक्षित (Saved) हो गया!');
      })
      .catch(err => {
        showToast('✅ स्थानीय और Cloud पर डेटा सुरक्षित हो गया!');
      })
      .finally(() => {
        saveBtn.innerText = "☁️ Save Online";
        saveBtn.disabled = false;
      });
    }

    function exportLines() {
      const lines = [];
      linesContainer.querySelectorAll('.line-input').forEach((inp, idx) => {
        if (inp.value.trim() !== '') {
          lines.push(`${idx + 1}. ${inp.value}`);
        }
      });

      if (lines.length === 0) {
        showToast('⚠️ पहले कुछ लिखें!');
        return;
      }

      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Aquarium_Notes.txt';
      link.click();
      showToast('📥 फाइल डाउनलोड हो गई!');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedBg = localStorage.getItem('aquarium_page_bg');
      const savedText = localStorage.getItem('aquarium_page_text');
      const savedLine = localStorage.getItem('aquarium_page_line');
      if (savedBg && savedText && savedLine) {
        setPageColor(savedBg, savedText, savedLine);
      }

      const localData = localStorage.getItem('aquarium_notebook_lines');
      let loaded = false;
      if (localData) {
        try {
          const arr = JSON.parse(localData);
          if (Array.isArray(arr) && arr.length > 0) {
            linesContainer.innerHTML = '';
            arr.forEach(txt => addNewLine(txt, false));
            loaded = true;
          }
        } catch (e) {}
      }

      if (!loaded) {
        for (let i = 0; i < 8; i++) addNewLine('', false);
      }

      // Fetch Online Backup
      fetch(CLOUD_SCRIPT_URL)
        .then(res => res.json())
        .then(resData => {
          if (resData.status === "success" && Array.isArray(resData.data) && resData.data.length > 0) {
            linesContainer.innerHTML = '';
            resData.data.forEach(txt => addNewLine(txt, false));
            autoSaveLinesLocal();
          }
        })
        .catch(e => console.log("Offline mode active"));
    });

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }
  </script>
</body>
</html>
