<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline File Manager</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;justify-content:center;align-items:center;padding:25px;
}
.container{
  width:min(950px,100%);background:rgba(255,255,255,.96);
  border-radius:22px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.25)
}
h1{text-align:center;margin:0 0 8px;color:#222}
.subtitle{text-align:center;color:#666;margin-bottom:25px}
.upload-area{
  border:2px dashed #667eea;border-radius:18px;padding:30px;text-align:center;
  background:#f7f8ff;cursor:pointer;transition:.2s
}
.upload-area:hover{background:#eef0ff}
input[type=file]{display:none}
.upload-btn,.action{
  border:0;border-radius:10px;padding:10px 16px;color:#fff;font-weight:bold;
  cursor:pointer;font-size:14px
}
.upload-btn{background:#667eea;margin-top:12px}
.file-list{margin-top:25px}
.file-item{
  display:flex;align-items:center;gap:15px;padding:15px;margin-bottom:12px;
  border-radius:14px;background:#f5f5f5;border:1px solid #e4e4e4
}
.file-icon{font-size:28px;width:42px;text-align:center}
.file-info{flex:1;min-width:0}
.file-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:12px;color:#777;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.view{background:#17a673}.download{background:#3478db}.delete{background:#e04b4b}
.empty{text-align:center;color:#777;padding:30px}
.status{text-align:center;margin-top:15px;color:#555;font-size:13px}
@media(max-width:650px){
  .file-item{align-items:flex-start;flex-wrap:wrap}
  .file-info{width:calc(100% - 60px)}
  .actions{width:100%;padding-left:57px}
}
</style>
</head>
<body>
<div class="container">
  <h1>📁 Offline File Manager</h1>
  <div class="subtitle">Upload, View, Download & Delete your files</div>

  <label class="upload-area" for="fileInput">
    <div style="font-size:42px">📤</div>
    <h3>Click here to select files</h3>
    <div>Files are stored locally in this browser.</div>
    <span class="upload-btn">Choose Files</span>
  </label>
  <input id="fileInput" type="file" multiple>

  <div class="status" id="status"></div>
  <div class="file-list" id="fileList"></div>
</div>

<script>
const SUPABASE_URL = "https://zaoyprnkmsrqecqgyqyr.supabase.co";
const SUPABASE_KEY = "sb_publishable_IcqJlCroAKIzxQypw_n6sA_M3YxG881";
const BUCKET = "files";
const TABLE = "uploaded_files";

const statusEl = document.getElementById("status");
const listEl = document.getElementById("fileList");

function sbHeaders(extra = {}) {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    ...extra
  };
}

async function sbFetch(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: sbHeaders(options.headers || {})
  });

  if (!response.ok) {
    let message = response.status + " " + response.statusText;
    try {
      const data = await response.json();
      message = data.message || data.error || message;
    } catch (_) {}
    throw new Error(message);
  }

  if (response.status === 204) return null;
  return response.json();
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}

function icon(type, name) {
  if ((type || "").includes("pdf") || name.toLowerCase().endsWith(".pdf")) return "📕";
  if ((type || "").startsWith("image/")) return "🖼️";
  if ((type || "").includes("word") || /\.(doc|docx)$/i.test(name)) return "📘";
  if ((type || "").includes("sheet") || /\.(xls|xlsx)$/i.test(name)) return "📗";
  return "📄";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[m]));
}

/* Read file list from Supabase database */
async function getFiles() {
  return sbFetch(
    `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc`
  );
}

/* Upload file to Storage, then save its details in the database */
async function addFile(file) {
  const safeName = file.name.replace(/[^\w.\- ()]/g, "_");
  const path =
    Date.now() + "_" +
    Math.random().toString(36).slice(2, 8) + "_" +
    safeName;

  const uploadUrl =
    `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(path)}`;

  const uploadResponse = await fetch(uploadUrl, {
    method: "POST",
    headers: sbHeaders({
      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "false"
    }),
    body: file
  });

  if (!uploadResponse.ok) {
    let message = uploadResponse.status + " " + uploadResponse.statusText;
    try {
      const data = await uploadResponse.json();
      message = data.message || data.error || message;
    } catch (_) {}
    throw new Error("Storage upload failed: " + message);
  }

  try {
    await sbFetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        file_name: file.name,
        file_path: path,
        file_size: file.size,
        file_type: file.type || "application/octet-stream"
      })
    });
  } catch (error) {
    /* Roll back Storage upload if database insert fails */
    try {
      await fetch(uploadUrl, {
        method: "DELETE",
        headers: sbHeaders()
      });
    } catch (_) {}
    throw new Error("Database save failed: " + error.message);
  }
}

async function getFile(id) {
  const rows = await sbFetch(
    `${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}&select=*`
  );
  return rows && rows.length ? rows[0] : null;
}

async function deleteFile(id) {
  const file = await getFile(id);
  if (!file) return;

  const storageUrl =
    `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(file.file_path)}`;

  const storageResponse = await fetch(storageUrl, {
    method: "DELETE",
    headers: sbHeaders()
  });

  if (!storageResponse.ok) {
    throw new Error("Could not delete file from Storage.");
  }

  await sbFetch(
    `${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`,
    { method: "DELETE" }
  );
}

async function render() {
  try {
    const files = await getFiles();
    const list = document.getElementById("fileList");

    if (!files.length) {
      list.innerHTML = '<div class="empty">No files uploaded yet.</div>';
      return;
    }

    list.innerHTML = files.map(f => `
      <div class="file-item">
        <div class="file-icon">${icon(f.file_type, f.file_name)}</div>
        <div class="file-info">
          <div class="file-name" title="${escapeHtml(f.file_name)}">${escapeHtml(f.file_name)}</div>
          <div class="file-meta">${formatSize(Number(f.file_size || 0))} • ${f.created_at ? new Date(f.created_at).toLocaleString() : ""}</div>
        </div>
        <div class="actions">
          <button class="action view" onclick="viewFile(${f.id})">View</button>
          <button class="action download" onclick="downloadFile(${f.id})">Download</button>
          <button class="action delete" onclick="removeFile(${f.id})">Delete</button>
        </div>
      </div>
    `).join("");
  } catch (error) {
    document.getElementById("fileList").innerHTML =
      '<div class="empty">Unable to load files.</div>';
    statusEl.textContent = "Error: " + error.message;
  }
}

async function viewFile(id) {
  try {
    const file = await getFile(id);
    if (!file) return;

    const url =
      `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(file.file_path)}`;

    window.open(url, "_blank");
  } catch (error) {
    statusEl.textContent = "View error: " + error.message;
  }
}

async function downloadFile(id) {
  try {
    const file = await getFile(id);
    if (!file) return;

    const url =
      `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(file.file_path)}`;

    const response = await fetch(url);
    if (!response.ok) throw new Error("Could not download file.");

    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = file.file_name;
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
  } catch (error) {
    statusEl.textContent = "Download error: " + error.message;
  }
}

async function removeFile(id) {
  const file = await getFile(id);
  if (!file) return;

  if (confirm("Delete this file?\n\n" + file.file_name)) {
    try {
      await deleteFile(id);
      statusEl.textContent = "File deleted successfully.";
      await render();
    } catch (error) {
      statusEl.textContent = "Delete error: " + error.message;
    }
  }
}

document.getElementById("fileInput").addEventListener("change", async e => {
  const files = [...e.target.files];
  if (!files.length) return;

  try {
    statusEl.textContent = "Uploading...";
    for (const file of files) {
      await addFile(file);
    }

    statusEl.textContent =
      files.length + " file(s) uploaded successfully.";
    await render();
  } catch (error) {
    statusEl.textContent = "Upload error: " + error.message;
  }

  e.target.value = "";
});

/* Load online files when page opens */
render();
</script>
</body>
</html>
