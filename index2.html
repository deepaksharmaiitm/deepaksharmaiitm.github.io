<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Reminders</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --card-bg: rgba(235, 238, 243, 0.95);
      --card-inner: #ffffff;
      --primary: #3b66f5;
      --danger: #eb4d4b;
      --success: #20bf6b;
      --text: #2d3436;
      --text-muted: #636e72;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #1e2433 0%, var(--bg-dark) 100%);
      margin: 0;
      padding: 20px;
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .dashboard {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .title-group h1 {
      margin: 0;
      font-size: 24px;
      color: #1e272e;
    }
    .title-group p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .clock-widget {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .analog-clock {
      width: 65px;
      height: 65px;
      border: 3px solid #2d3436;
      border-radius: 50%;
      position: relative;
      background: #fff;
    }
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background: #2d3436;
      border-radius: 4px;
    }
    .hour-hand { width: 3px; height: 18px; }
    .min-hand { width: 2px; height: 25px; }
    .sec-hand { width: 1.5px; height: 28px; background: #e74c3c; }
    .digital-time {
      font-weight: 700;
      font-size: 17px;
      color: #1e272e;
    }
    .digital-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .action-bar {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 9px 14px;
      border: 1px solid #dcdde1;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }
    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-neutral { background: #dcdde1; color: #2f3640; }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.7);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #2f3640;
    }
    .tab-btn.active {
      background: #2f3640;
      color: white;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reminder-item {
      background: var(--card-inner);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .reminder-item.completed {
      opacity: 0.6;
      border-left-color: var(--success);
      text-decoration: line-through;
    }
    .task-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-box {
      background: var(--card-inner);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: #1e272e;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 99;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 14px;
      width: 90%;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Header -->
    <div class="header-card">
      <div class="title-group">
        <h1>🔔 Ultra Reminders</h1>
        <p>Online • Stored in Google Sheets</p>
      </div>
      <div class="clock-widget">
        <div class="analog-clock">
          <div class="hand hour-hand" id="hrHand"></div>
          <div class="hand min-hand" id="minHand"></div>
          <div class="hand sec-hand" id="secHand"></div>
        </div>
        <div>
          <div class="digital-time" id="digiTime">00:00:00 AM</div>
          <div class="digital-date" id="digiDate">Loading...</div>
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search reminders..." onkeyup="renderReminders()">
      <button class="btn btn-primary" onclick="openModal()">+ Add Reminder</button>
      <button class="btn btn-neutral" onclick="fetchReminders()">🔄 Refresh</button>
    </div>

    <!-- Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setFilter('All', this)">All</button>
      <button class="tab-btn" onclick="setFilter('Today', this)">Today</button>
      <button class="tab-btn" onclick="setFilter('Upcoming', this)">Upcoming</button>
      <button class="tab-btn" onclick="setFilter('Completed', this)">Completed</button>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- List -->
      <div class="card">
        <h3 class="card-title">📝 My Reminders</h3>
        <div id="reminderList">Loading reminders from Google Sheet...</div>
      </div>

      <!-- Stats -->
      <div class="card">
        <h3 class="card-title">📊 Overview</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="pendingCount" style="color:var(--primary);">0</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="todayCount" style="color:#e67e22;">0</div>
            <div class="stat-label">Today</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="doneCount" style="color:var(--success);">0</div>
            <div class="stat-label">Done</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">नया रिमाइंडर जोड़ें</h3>
      <form id="reminderForm">
        <div style="margin-bottom:12px;">
          <label style="font-size:13px; font-weight:bold;">टास्क का नाम:</label>
          <input type="text" name="task" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:13px; font-weight:bold;">तारीख:</label>
          <input type="date" name="remindDate" required style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
        </div>
        <div style="margin-bottom:12px;">
          <label style="font-size:13px; font-weight:bold;">समय:</label>
          <input type="time" name="remindTime" value="09:00" style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;">
        </div>
        <div style="margin-bottom:15px;">
          <label style="font-size:13px; font-weight:bold;">नोट्स (विवरण):</label>
          <textarea name="notes" rows="2" style="width:100%; padding:8px; margin-top:4px; box-sizing:border-box;"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" class="btn btn-neutral" onclick="closeModal()">रद्द करें</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">सेव करें</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtd_hUqUNKivJTg-RAbz8XUp_Fx9UhAmTHh6hmsI9WW-aDFliMXhSGL-mLDIGqsR55eg/exec";

    let reminders = [];
    let currentFilter = 'All';

    // Clock
    function updateClock() {
      const now = new Date();
      const s = now.getSeconds();
      const m = now.getMinutes();
      const h = now.getHours();

      document.getElementById('secHand').style.transform = `rotate(${s * 6}deg)`;
      document.getElementById('minHand').style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
      document.getElementById('hrHand').style.transform = `rotate(${h * 30 + m * 0.5}deg)`;

      document.getElementById('digiTime').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      document.getElementById('digiDate').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Fetch
    function fetchReminders() {
      document.getElementById('reminderList').innerHTML = '<div style="text-align:center; padding:20px;">शीट से लोड हो रहा है...</div>';
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          reminders = data || [];
          renderReminders();
        })
        .catch(err => {
          document.getElementById('reminderList').innerHTML = '<div style="color:red; text-align:center;">डेटा लोड नहीं हो पाया।</div>';
        });
    }

    // Render
    function renderReminders() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('reminderList');
      const todayStr = new Date().toISOString().split('T')[0];

      let filtered = reminders.filter(item => {
        const matchesSearch = item.task.toLowerCase().includes(query) || (item.notes && item.notes.toLowerCase().includes(query));
        if (!matchesSearch) return false;

        if (currentFilter === 'Completed') return item.status === 'Completed';
        if (currentFilter === 'Today') return item.remindDate === todayStr;
        if (currentFilter === 'Upcoming') return item.remindDate > todayStr && item.status !== 'Completed';
        return true;
      });

      // Stats
      document.getElementById('totalCount').innerText = reminders.length;
      document.getElementById('pendingCount').innerText = reminders.filter(r => r.status !== 'Completed').length;
      document.getElementById('todayCount').innerText = reminders.filter(r => r.remindDate === todayStr).length;
      document.getElementById('doneCount').innerText = reminders.filter(r => r.status === 'Completed').length;

      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">कोई रिमाइंडर नहीं मिला।</div>';
        return;
      }

      list.innerHTML = filtered.map(item => {
        const isDone = item.status === 'Completed';
        return `
          <div class="reminder-item ${isDone ? 'completed' : ''}">
            <div>
              <div style="font-weight:700; font-size:15px; color:#2c3e50;">${item.task}</div>
              <div class="task-meta">
                📅 ${item.remindDate} • ⏰ ${item.remindTime} ${item.notes ? '• 📝 ' + item.notes : ''}
              </div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-success" style="padding:5px 10px; font-size:11px;" onclick="toggleStatus(${item.rowIndex}, '${item.status}')">${isDone ? 'Undo' : 'Done'}</button>
              <button class="btn btn-danger" style="padding:5px 10px; font-size:11px;" onclick="deleteReminder(${item.rowIndex})">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Delete Action
    function deleteReminder(rowIndex) {
      if (!confirm("क्या आप वाकई इस रिमाइंडर को हमेशा के लिए डिलीट करना चाहते हैं?")) return;

      const fd = new FormData();
      fd.append("action", "delete");
      fd.append("rowIndex", rowIndex);

      fetch(SCRIPT_URL, { method: "POST", body: fd })
        .then(() => fetchReminders())
        .catch(() => fetchReminders());
    }

    // Toggle Done/Undo Action
    function toggleStatus(rowIndex, currentStatus) {
      const fd = new FormData();
      fd.append("action", "toggle");
      fd.append("rowIndex", rowIndex);
      fd.append("status", currentStatus);

      fetch(SCRIPT_URL, { method: "POST", body: fd })
        .then(() => fetchReminders())
        .catch(() => fetchReminders());
    }

    // Add New
    document.getElementById('reminderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = "सेव हो रहा है...";

      const fd = new FormData(this);
      fd.append("action", "add");

      fetch(SCRIPT_URL, { method: "POST", body: fd })
        .then(() => {
          closeModal();
          this.reset();
          fetchReminders();
        })
        .finally(() => {
          saveBtn.disabled = false;
          saveBtn.innerText = "सेव करें";
        });
    });

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReminders();
    }

    function openModal() { document.getElementById('addModal').classList.add('open'); }
    function closeModal() { document.getElementById('addModal').classList.remove('open'); }

    fetchReminders();
  </script>
</body>
</html>
